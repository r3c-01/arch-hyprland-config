# Modified 2026-11-19: standalone colors/fonts, screenshot background,
# all-output fields, compact date/time layout, no wallust or helper scripts.

general {
    grace = 1
}

background {
    monitor =
    path = screenshot
    blur_size = 3
    blur_passes = 2
    brightness = 0.8
}

input-field {
    monitor =
    size = 230, 70
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(200,200,210)
    inner_color = rgba(20,20,30,0.8)
    font_color = rgb(240,240,245)
    fade_on_empty = false
    font_family = JetBrains Mono Nerd Font
    placeholder_text = <i>Password</i>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:18000000] date +'%A, %-d %B'
    color = rgb(230,230,240)
    font_size = 32
    font_family = JetBrains Mono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +'%I:%M %p'
    color = rgb(230,230,240)
    font_size = 72
    font_family = JetBrains Mono Nerd Font
    position = 0, 0
    halign = center
    valign = center
}
